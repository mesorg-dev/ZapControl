name: Build Android

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (ubuntu)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Rust (Android NDK target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install NDK
        id: ndk
        run: |
          set -euo pipefail
          echo "SDK contents:"
          ls -la "$ANDROID_HOME" || true
          echo "Existing NDKs:"
          ls -la "$ANDROID_HOME/ndk" 2>/dev/null || echo "(none)"
          NDK_VER="27.2.12479018"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            mkdir -p "$ANDROID_HOME/licenses"
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
            echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER"
          fi
          NDK_DIR=$(ls -d "$ANDROID_HOME/ndk"/* 2>/dev/null | head -1)
          if [ -z "$NDK_DIR" ]; then
            echo "::error::NDK not found after install"
            ls -la "$ANDROID_HOME"
            exit 1
          fi
          echo "ndk_dir=$NDK_DIR" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $NDK_DIR"

      - name: Build FFI cdylib (arm64-v8a)
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${{ steps.ndk.outputs.ndk_dir }}"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          OUT_DIR="$GITHUB_WORKSPACE/android/app/src/main/jniLibs"
          set +e
          (cd crates/zapret-core-ffi && cargo ndk -t arm64-v8a -o "$OUT_DIR" build --release) 2>&1 | tee /tmp/cargo-ndk.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "## cargo-ndk failed (exit $RC)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 /tmp/cargo-ndk.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            LOG_TAIL=$(tail -n 15 /tmp/cargo-ndk.log | tr '\n' ' | ' | tr -d '\r')
            echo "::error::cargo-ndk exit $RC :: $LOG_TAIL"
            exit "$RC"
          fi
          echo "Built libs:"
          find android/app/src/main/jniLibs -type f -name "*.so" -exec ls -la {} \;

      - name: Generate Kotlin bindings from built .so
        run: |
          set -euo pipefail
          SO="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libzapret_core_ffi.so"
          echo "Using .so: $SO"
          if [ ! -f "$SO" ]; then
            SO=$(find "$GITHUB_WORKSPACE/android/app/src/main/jniLibs" -name "libzapret_core_ffi.so" | head -1)
          fi
          if [ -z "$SO" ] || [ ! -f "$SO" ]; then
            echo "::error::libzapret_core_ffi.so not found"
            exit 1
          fi
          set +e
          # run from crate dir: uniffi-bindgen calls cargo metadata (needs Cargo.toml)
          (cd crates/zapret-core-ffi && cargo run --bin uniffi-bindgen -- \
            generate --language kotlin \
            --out-dir "$GITHUB_WORKSPACE/android/app/src/main/java" \
            --library "$SO" --crate zapret_core_ffi) 2>&1 | tee /tmp/bindgen.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            LOG_TAIL=$(tail -n 15 /tmp/bindgen.log | tr '\n' ' | ')
            echo "::error::bindgen exit $RC :: $LOG_TAIL"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -n 40 /tmp/bindgen.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$RC"
          fi
          echo "Generated:"
          find "$GITHUB_WORKSPACE/android/app/src/main/java/uniffi" -type f

      - name: Build APK
        working-directory: android
        run: |
          set +e
          gradle assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            # Kotlin errors first, then gradle's "what went wrong" block
            LOG_TAIL=$(grep -E "^e: |error: |FAILURE:|\* What went wrong|Caused by" /tmp/gradle.log | tail -15 | tr '\n' ' | ')
            if [ -z "$LOG_TAIL" ]; then
              LOG_TAIL=$(tail -n 15 /tmp/gradle.log | tr '\n' ' | ')
            fi
            echo "::error::gradle assembleDebug exit $RC :: $LOG_TAIL"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e: |error: |\* What went wrong|Caused by" /tmp/gradle.log | tail -40 >> "$GITHUB_STEP_SUMMARY" || tail -n 60 /tmp/gradle.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$RC"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
