name: Build Android

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (ubuntu)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Rust (Android NDK target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install NDK
        id: ndk
        run: |
          set -euo pipefail
          echo "SDK contents:"
          ls -la "$ANDROID_HOME" || true
          echo "Existing NDKs:"
          ls -la "$ANDROID_HOME/ndk" 2>/dev/null || echo "(none)"
          NDK_VER="27.2.12479018"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            mkdir -p "$ANDROID_HOME/licenses"
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
            echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER"
          fi
          NDK_DIR=$(ls -d "$ANDROID_HOME/ndk"/* 2>/dev/null | head -1)
          if [ -z "$NDK_DIR" ]; then
            echo "::error::NDK not found after install"
            ls -la "$ANDROID_HOME"
            exit 1
          fi
          echo "ndk_dir=$NDK_DIR" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $NDK_DIR"

      - name: Build FFI cdylib (arm64-v8a)
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${{ steps.ndk.outputs.ndk_dir }}"
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build -p zapret-core-ffi --release
          echo "Built libs:"
          find android/app/src/main/jniLibs -type f -name "*.so" -exec ls -la {} \;

      - name: Generate Kotlin bindings from built .so
        run: |
          set -euo pipefail
          SO=$(find android/app/src/main/jniLibs -name "libzapret_core_ffi.so" | head -1)
          echo "Using .so: $SO"
          cargo run -p zapret-core-ffi --bin uniffi-bindgen -- \
            generate --language kotlin \
            --out-dir android/app/src/main/java \
            --library "$SO" --crate zapret_core_ffi
          echo "Generated:"
          find android/app/src/main/java/uniffi -type f

      - name: Build APK
        run: gradle assembleDebug --stacktrace
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
