[package]
name = "zapret-core"
version = "0.1.0"
description = "Portable core for ZapControl: settings, strategies, targets, scoring, roblox fix"
edition = "2021"
license = "GPL-3.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
