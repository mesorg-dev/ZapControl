[package]
name = "zapret-core-ffi"
version = "0.1.0"
description = "UniFFI bindings for zapret-core (Android/Kotlin consumers)"
edition = "2021"
license = "GPL-3.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dependencies]
zapret-core = { path = "../zapret-core" }
uniffi = { version = "0.29", features = ["cli"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
